services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment: &app-env
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      RECONCILE_GRACE_SECONDS: ${RECONCILE_GRACE_SECONDS:-30}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-60000}
    command: ["node", "dist/migrate.js"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment: *app-env
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: .
    environment: *app-env
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  postgres-data:
